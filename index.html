<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#84cc16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hitung TK" />
  <title>Ayo Main & Belajar TK</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-kids: "Fredoka", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      --bg-cream: #f3efe4;
      --ink-dark: #0f172a;
      --ink-muted: #57534e;
      --lime-pop: #84cc16;
      --lime-dark: #4d7c0f;
      --navy-pop: #0f172a;
      --periwinkle: #818cf8;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-kids);
    }

    body {
      background: #e7e2d4;
      color: var(--ink-dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: screenPop 0.28s var(--ease-bounce);
    }

    @keyframes screenPop {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes jellyBounce {
      0% { transform: scale(1, 1) translateY(0); }
      28% { transform: scale(1.12, 0.88) translateY(3px); }
      55% { transform: scale(0.94, 1.07) translateY(-7px); }
      78% { transform: scale(1.03, 0.98) translateY(-1px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    @keyframes floatBlob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .bounce-now {
      animation: jellyBounce 0.45s var(--ease-bounce) !important;
    }

    /* LAYAR 1: INSPIRASI REFERENSI */
    .splash-card {
      position: relative;
      width: 100%;
      min-height: 620px;
      background: var(--bg-cream);
      border-radius: 30px;
      border: 3px solid #d6d0c0;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-blobs {
      position: relative;
      height: 122px;
      width: 100%;
      pointer-events: none;
    }

    .blob-lime {
      position: absolute;
      top: -34px;
      left: -26px;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: var(--lime-pop);
      animation: floatBlob 4.2s ease-in-out infinite;
    }

    .blob-navy {
      position: absolute;
      top: 18px;
      left: 196px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--navy-pop);
      animation: floatBlob 3.4s ease-in-out 0.5s infinite;
    }

    .blob-blue {
      position: absolute;
      top: -18px;
      right: -28px;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: var(--periwinkle);
      animation: floatBlob 4.8s ease-in-out 0.9s infinite;
    }

    .splash-body {
      position: relative;
      z-index: 2;
      padding: 4px 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .splash-title {
      font-size: 2.05rem;
      font-weight: 700;
      line-height: 1.08;
      color: var(--ink-dark);
    }

    .splash-sub {
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-muted);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--ink-dark);
    }

    .splash-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: var(--ink-dark);
      font-size: 1.08rem;
      font-weight: 600;
      user-select: text;
      -webkit-user-select: text;
      outline: none;
      transition: border-color 0.15s ease, transform 0.2s var(--ease-bounce);
    }

    .splash-input:focus {
      border-color: var(--lime-dark);
      transform: scale(1.01);
    }

    .question-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .q-pill {
      padding: 8px 6px;
      border-radius: 13px;
      border: 2px solid #d6d0c0;
      background: #ffffff;
      color: var(--ink-dark);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.22s var(--ease-bounce), background 0.15s ease, border-color 0.15s ease;
    }

    .q-pill:active {
      transform: scale(0.92);
    }

    .q-pill.active {
      background: #ecfccb;
      border-color: var(--lime-dark);
      color: #365314;
      transform: translateY(-2px) scale(1.03);
    }

    .btn-primary-dark {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: none;
      background: var(--navy-pop);
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #334155;
      transition: transform 0.22s var(--ease-bounce), box-shadow 0.12s ease;
    }

    .btn-primary-dark:active {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 1px 0 #334155;
    }

    .btn-secondary-cream {
      width: 100%;
      padding: 11px 16px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #faf8f3;
      color: var(--ink-dark);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.22s var(--ease-bounce);
    }

    .btn-secondary-cream:active {
      transform: scale(0.97);
    }

    .btn-secondary-cream.hidden {
      display: none;
    }

    .form-msg {
      min-height: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #dc2626;
      text-align: center;
    }

    /* Karakter hijau bermata besar interaktif */
    .bottom-monster {
      position: relative;
      width: 100%;
      height: 132px;
      margin-top: 4px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-origin: bottom center;
      transition: transform 0.28s var(--ease-bounce);
    }

    .bottom-monster.hop {
      animation: monsterHop 0.55s var(--ease-bounce);
    }

    @keyframes monsterHop {
      0% { transform: scale(1, 1) translateY(0); }
      22% { transform: scale(1.14, 0.84) translateY(6px); }
      52% { transform: scale(0.93, 1.1) translateY(-18px); }
      78% { transform: scale(1.05, 0.96) translateY(-3px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .monster-dome {
      width: 116%;
      height: 144px;
      background: var(--lime-pop);
      border-top-left-radius: 50% 72%;
      border-top-right-radius: 50% 72%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
    }

    .monster-tuft {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 18px;
      background: var(--lime-pop);
      border-radius: 14px 14px 0 0;
    }

    .monster-eyes {
      display: flex;
      gap: 24px;
      margin-top: 6px;
    }

    .eye-socket {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .brow {
      width: 22px;
      height: 5px;
      background: #0f172a;
      border-radius: 999px;
      transition: transform 0.25s var(--ease-bounce);
    }

    .brow.left { transform: rotate(-10deg); }
    .brow.right { transform: rotate(10deg); }

    .bottom-monster.hop .brow.left { transform: rotate(-18deg) translateY(-3px); }
    .bottom-monster.hop .brow.right { transform: rotate(18deg) translateY(-3px); }

    .eyeball {
      width: 56px;
      height: 56px;
      background: #ffffff;
      border-radius: 50%;
      border: 3px solid #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.14s ease;
    }

    .eyeball.blink {
      transform: scaleY(0.12);
    }

    .pupil {
      width: 22px;
      height: 22px;
      background: #0f172a;
      border-radius: 50%;
      position: relative;
      transition: transform 0.08s linear;
    }

    .pupil::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 4px;
      width: 7px;
      height: 7px;
      background: #ffffff;
      border-radius: 50%;
    }

    .nostrils {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .nostril {
      width: 7px;
      height: 6px;
      background: #3f6212;
      border-radius: 50%;
    }

    /* LAYAR 2: LOBBY 6 KOTAK GAME */
    .lobby-header {
      width: 100%;
      background: var(--bg-cream);
      border: 3px solid #d6d0c0;
      border-radius: 22px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 0 #c7c0ae;
    }

    .greeting-main {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }

    .greeting-sub {
      font-size: 0.88rem;
      font-weight: 600;
      color: #57534e;
    }

    .small-btn {
      padding: 8px 12px;
      border-radius: 13px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s var(--ease-bounce);
    }

    .small-btn:active {
      transform: scale(0.92);
    }

    .games-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .game-box {
      position: relative;
      overflow: hidden;
      background: var(--bg-cream);
      border: 3px solid #d6d0c0;
      border-radius: 22px;
      padding: 13px 10px;
      min-height: 142px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #c7c0ae;
      transition: transform 0.24s var(--ease-bounce);
    }

    .game-box:hover {
      transform: translateY(-2px);
    }

    .game-box:active {
      transform: scale(0.94);
    }

    .game-box.ready {
      background: #ecfccb;
      border-color: var(--lime-pop);
      box-shadow: 0 5px 0 var(--lime-dark);
    }

    .game-box.coming {
      background: #faf8f3;
      border-style: dashed;
      border-color: #a8a29e;
      box-shadow: 0 4px 0 #e7e2d4;
    }

    .game-icon {
      font-size: 2.25rem;
      line-height: 1.1;
      transition: transform 0.25s var(--ease-bounce);
    }

    .game-box:active .game-icon {
      transform: scale(1.22) rotate(-6deg);
    }

    .game-title {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.18;
    }

    .game-tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .game-box.ready .game-tag {
      background: #0f172a;
      color: #ffffff;
    }

    .game-box.coming .game-tag {
      background: #fef9c3;
      color: #854d0e;
    }

    .tap-ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(132, 204, 22, 0.35);
      transform: translate(-50%, -50%) scale(0.2);
      animation: rippleBurst 0.48s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleBurst {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(5.5); }
    }

    .idea-banner {
      width: 100%;
      background: var(--bg-cream);
      border: 2.5px solid #d6d0c0;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LAYAR 3: GAME AKTIF */
    .top-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .pill {
      background: #ffffff;
      border: 2px solid #7dd3fc;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #38bdf8;
      white-space: nowrap;
      color: #0f172a;
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce);
    }

    .pill:active {
      transform: scale(0.92);
    }

    .level-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .lvl-btn {
      flex: 1;
      padding: 7px 6px;
      border-radius: 14px;
      border: 2px solid #93c5fd;
      background: #ffffff;
      color: #1e3a8a;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce), background 0.15s ease;
    }

    .lvl-btn:active {
      transform: scale(0.94);
    }

    .lvl-btn.active {
      background: #0284c7;
      border-color: #0369a1;
      color: #ffffff;
      box-shadow: 0 2px 0 #075985;
      transform: translateY(-1px);
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid #0284c7;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.18);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- LAYAR 1: TAMPILAN PERTAMA -->
    <section id="splashScreen" class="screen">
      <div class="splash-card">
        <div class="top-blobs">
          <div class="blob-lime"></div>
          <div class="blob-navy"></div>
          <div class="blob-blue"></div>
        </div>

        <div class="splash-body">
          <h1 class="splash-title">Ayo main &amp; hitung seru!</h1>
          <p class="splash-sub">Kenali bentuk, warna, dan hewan lucu. Tulis namamu dulu ya!</p>

          <div class="input-group">
            <label for="playerNameInput" class="input-label">Nama kamu siapa?</label>
            <input
              id="playerNameInput"
              class="splash-input"
              type="text"
              maxlength="18"
              placeholder="Ketik nama kamu..."
              autocomplete="off"
            />
          </div>

          <div class="input-group">
            <div class="input-label">Hari ini lagi gimana?</div>
            <div class="question-pills" id="moodPills">
              <button type="button" class="q-pill active" data-mood="Semangat">😄 Ceria</button>
              <button type="button" class="q-pill" data-mood="Seru">🤩 Seru</button>
              <button type="button" class="q-pill" data-mood="Siap Main">🚀 Siap</button>
            </div>
          </div>

          <div id="splashMsg" class="form-msg"></div>

          <button id="saveStartBtn" type="button" class="btn-primary-dark">Mulai &amp; Pilih Game</button>
          <button id="quickContinueBtn" type="button" class="btn-secondary-cream hidden">Lanjut Sebagai ...</button>
        </div>

        <div id="monsterBuddy" class="bottom-monster" title="Ketuk aku!" aria-label="Karakter hijau lucu">
          <div class="monster-dome">
            <div class="monster-tuft"></div>
            <div class="monster-eyes">
              <div class="eye-socket">
                <div class="brow left"></div>
                <div class="eyeball"><div class="pupil"></div></div>
              </div>
              <div class="eye-socket">
                <div class="brow right"></div>
                <div class="eyeball"><div class="pupil"></div></div>
              </div>
            </div>
            <div class="nostrils">
              <div class="nostril"></div>
              <div class="nostril"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- LAYAR 2: 6 KOTAK PILIHAN GAME -->
    <section id="lobbyScreen" class="screen">
      <div class="lobby-header">
        <div>
          <div id="lobbyGreeting" class="greeting-main">Halo, Teman!</div>
          <div id="lobbySub" class="greeting-sub">Pilih 1 dari 6 kotak game</div>
        </div>
        <button id="changeNameBtn" type="button" class="small-btn">✏️ Ganti Nama</button>
      </div>

      <div id="gamesGrid" class="games-grid"></div>

      <div id="ideaBanner" class="idea-banner">
        💡 Kotak 1 siap dimainkan. 5 kotak lainnya disiapkan untuk ide game TK berikutnya!
      </div>
    </section>

    <!-- LAYAR 3: GAME AKTIF (KOTAK 1) -->
    <section id="gameScreen" class="screen">
      <div class="top-hud">
        <button id="backLobbyBtn" type="button" class="pill" style="background:#f1f5f9; border-color:#94a3b8; box-shadow:0 3px 0 #64748b;">← Menu</button>
        <div class="pill">⭐ <span id="starsEl">0</span></div>
        <div class="pill">🎯 <span id="pickedEl">0</span>/<span id="targetEl">2</span></div>
        <button id="voiceBtn" type="button" class="pill" style="background:#fef9c3; border-color:#facc15; box-shadow:0 3px 0 #eab308;">🔊</button>
      </div>

      <div class="level-bar">
        <button type="button" class="lvl-btn active" data-level="easy">Mudah</button>
        <button type="button" class="lvl-btn" data-level="medium">Sedang (+Hewan)</button>
        <button type="button" class="lvl-btn" data-level="mix">Campuran</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="440" height="586"></canvas>
      </div>
    </section>
  </div>

  <script>
    const splashScreen = document.getElementById("splashScreen");
    const lobbyScreen = document.getElementById("lobbyScreen");
    const gameScreen = document.getElementById("gameScreen");

    const playerNameInput = document.getElementById("playerNameInput");
    const moodPills = document.querySelectorAll(".q-pill");
    const splashMsg = document.getElementById("splashMsg");
    const saveStartBtn = document.getElementById("saveStartBtn");
    const quickContinueBtn = document.getElementById("quickContinueBtn");

    const monsterBuddy = document.getElementById("monsterBuddy");
    const pupils = document.querySelectorAll(".pupil");
    const eyeballs = document.querySelectorAll(".eyeball");

    const lobbyGreeting = document.getElementById("lobbyGreeting");
    const lobbySub = document.getElementById("lobbySub");
    const changeNameBtn = document.getElementById("changeNameBtn");
    const gamesGrid = document.getElementById("gamesGrid");
    const ideaBanner = document.getElementById("ideaBanner");
    const backLobbyBtn = document.getElementById("backLobbyBtn");

    const NAME_KEY = "tk_player_name";
    const MOOD_KEY = "tk_player_mood";

    let chosenMood = localStorage.getItem(MOOD_KEY) || "Semangat";

    const SIX_GAMES = [
      { id: "game-1", title: "Hitung Hewan, Bentuk & Warna", icon: "🐰🔺", ready: true, note: "Game 1 siap dimainkan!" },
      { id: "game-2", title: "Game Edukasi 2", icon: "🧩", ready: false, note: "Slot 2: ide game TK berikutnya." },
      { id: "game-3", title: "Game Edukasi 3", icon: "🎨", ready: false, note: "Slot 3: ide game TK berikutnya." },
      { id: "game-4", title: "Game Edukasi 4", icon: "🐾", ready: false, note: "Slot 4: ide game TK berikutnya." },
      { id: "game-5", title: "Game Edukasi 5", icon: "🔤", ready: false, note: "Slot 5: ide game TK berikutnya." },
      { id: "game-6", title: "Game Edukasi 6", icon: "🌈", ready: false, note: "Slot 6: ide game TK berikutnya." }
    ];

    function triggerBounce(el) {
      if (!el) return;
      el.classList.remove("bounce-now");
      void el.offsetWidth;
      el.classList.add("bounce-now");
    }

    // Interaksi monster hijau: melompat bounce + kedip + bola mata mengikuti sentuhan
    function hopMonster() {
      monsterBuddy.classList.remove("hop");
      void monsterBuddy.offsetWidth;
      monsterBuddy.classList.add("hop");
      eyeballs.forEach((eb) => eb.classList.add("blink"));
      setTimeout(() => eyeballs.forEach((eb) => eb.classList.remove("blink")), 150);
      playSound([[587.33, 0, 0.1, "triangle"], [783.99, 0.08, 0.14, "triangle"]]);
    }

    monsterBuddy.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      hopMonster();
    });

    window.addEventListener("pointermove", (e) => {
      if (!splashScreen.classList.contains("active")) return;
      pupils.forEach((pupil) => {
        const rect = pupil.parentElement.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const angle = Math.atan2(dy, dx);
        const maxOffset = 7;
        const dist = Math.min(maxOffset, Math.hypot(dx, dy) / 28);
        pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
      });
    });

    setInterval(() => {
      if (!splashScreen.classList.contains("active")) return;
      eyeballs.forEach((eb) => eb.classList.add("blink"));
      setTimeout(() => eyeballs.forEach((eb) => eb.classList.remove("blink")), 140);
    }, 3600);

    function showScreen(target) {
      [splashScreen, lobbyScreen, gameScreen].forEach((el) => el.classList.remove("active"));
      target.classList.add("active");
    }

    function refreshMoodButtons() {
      moodPills.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mood === chosenMood);
      });
    }

    function syncQuickContinue() {
      const saved = (localStorage.getItem(NAME_KEY) || "").trim();
      if (saved) {
        quickContinueBtn.textContent = `Lanjut sebagai ${saved} →`;
        quickContinueBtn.classList.remove("hidden");
      } else {
        quickContinueBtn.classList.add("hidden");
      }
    }

    function spawnCardRipple(card, clientX, clientY) {
      const rect = card.getBoundingClientRect();
      const rip = document.createElement("span");
      rip.className = "tap-ripple";
      rip.style.left = `${clientX - rect.left}px`;
      rip.style.top = `${clientY - rect.top}px`;
      card.appendChild(rip);
      setTimeout(() => rip.remove(), 500);
    }

    function renderLobby() {
      const saved = (localStorage.getItem(NAME_KEY) || "").trim();
      lobbyGreeting.textContent = `Halo, ${saved || "Teman"}!`;
      lobbySub.textContent = `Perasaan: ${chosenMood} • Pilih 1 dari 6 kotak`;

      gamesGrid.innerHTML = "";
      SIX_GAMES.forEach((game, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `game-box ${game.ready ? "ready" : "coming"}`;
        card.innerHTML = `
          <div class="game-icon">${game.icon}</div>
          <div class="game-title">${index + 1}. ${game.title}</div>
          <span class="game-tag">${game.ready ? "Main" : "Segera Hadir"}</span>
        `;
        card.addEventListener("pointerdown", (e) => {
          spawnCardRipple(card, e.clientX, e.clientY);
          triggerBounce(card);
        });
        card.addEventListener("click", () => {
          if (game.ready) {
            playSound([[523.25, 0, 0.1, "triangle"], [659.25, 0.08, 0.14, "triangle"]]);
            setTimeout(openCountGame, 160);
          } else {
            ideaBanner.textContent = `💡 ${game.note}`;
            triggerBounce(ideaBanner);
            playSound([[340, 0, 0.11, "sine"]]);
            speakText(`${game.title} segera hadir`);
          }
        });
        gamesGrid.appendChild(card);
      });
    }

    moodPills.forEach((btn) => {
      btn.addEventListener("click", () => {
        chosenMood = btn.dataset.mood;
        refreshMoodButtons();
        triggerBounce(btn);
        hopMonster();
      });
    });

    saveStartBtn.addEventListener("click", () => {
      triggerBounce(saveStartBtn);
      const name = playerNameInput.value.trim();
      if (!name) {
        splashMsg.textContent = "Tulis namamu dulu ya sebelum mulai!";
        triggerBounce(splashMsg);
        hopMonster();
        playerNameInput.focus();
        return;
      }
      splashMsg.textContent = "";
      localStorage.setItem(NAME_KEY, name);
      localStorage.setItem(MOOD_KEY, chosenMood);
      renderLobby();
      showScreen(lobbyScreen);
      speakText(`Halo ${name}, ayo pilih kotak game!`);
    });

    quickContinueBtn.addEventListener("click", () => {
      triggerBounce(quickContinueBtn);
      const saved = (localStorage.getItem(NAME_KEY) || "").trim();
      if (!saved) return;
      renderLobby();
      showScreen(lobbyScreen);
      speakText(`Selamat datang kembali, ${saved}!`);
    });

    changeNameBtn.addEventListener("click", () => {
      triggerBounce(changeNameBtn);
      playerNameInput.value = localStorage.getItem(NAME_KEY) || "";
      splashMsg.textContent = "";
      refreshMoodButtons();
      syncQuickContinue();
      showScreen(splashScreen);
    });

    backLobbyBtn.addEventListener("click", () => {
      triggerBounce(backLobbyBtn);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      renderLobby();
      showScreen(lobbyScreen);
    });

    // --- Game 1: Hitung Hewan, Bentuk & Warna (Dengan Bounce Canvas) ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const starsEl = document.getElementById("starsEl");
    const pickedEl = document.getElementById("pickedEl");
    const targetEl = document.getElementById("targetEl");
    const voiceBtn = document.getElementById("voiceBtn");
    const lvlBtns = document.querySelectorAll(".lvl-btn");

    const ANIMALS = [
      { emoji: "🐶", name: "Anjing" },
      { emoji: "🐱", name: "Kucing" },
      { emoji: "🐸", name: "Katak" },
      { emoji: "🐥", name: "Anak Ayam" },
      { emoji: "🐰", name: "Kelinci" }
    ];

    const SHAPES = [
      { id: "circle", name: "Lingkaran" },
      { id: "triangle", name: "Segitiga" },
      { id: "square", name: "Kotak" },
      { id: "star", name: "Bintang" }
    ];

    const COLORS = [
      { name: "Merah", fill: "#ef4444", stroke: "#991b1b" },
      { name: "Kuning", fill: "#facc15", stroke: "#a16207" },
      { name: "Hijau", fill: "#22c55e", stroke: "#166534" },
      { name: "Biru", fill: "#3b82f6", stroke: "#1e40af" },
      { name: "Ungu", fill: "#a855f7", stroke: "#6b21a8" }
    ];

    let levelMode = "easy";
    let stars = Number(localStorage.getItem("tk_hitung_stars") || 0);
    starsEl.textContent = stars;

    let targetCount = 2;
    let pickedCount = 0;
    let mission = null;
    let cards = [];
    let sparkles = [];
    let ripples = [];
    let helperAnimal = ANIMALS[4];
    let helperHop = 0;
    let statusMsg = "Ketuk yang sesuai!";
    let statusColor = "#0369a1";
    let locked = false;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(notes) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        notes.forEach(([freq, delay, dur, type = "sine"]) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.12, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur);
        });
      } catch (_) {}
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "id-ID";
        utter.rate = 0.92;
        utter.pitch = 1.15;
        window.speechSynthesis.speak(utter);
      } catch (_) {}
    }

    function getMissionSpeech() {
      if (!mission) return "";
      if (mission.animal) {
        return `Cari ${targetCount} ${mission.shape.name} warna ${mission.color.name} bergambar ${mission.animal.name}`;
      }
      return `Cari ${targetCount} ${mission.shape.name} warna ${mission.color.name}`;
    }

    function drawShapePath(shapeId, r) {
      ctx.beginPath();
      if (shapeId === "circle") {
        ctx.arc(0, 0, r, 0, Math.PI * 2);
      } else if (shapeId === "square") {
        ctx.roundRect(-r * 0.88, -r * 0.88, r * 1.76, r * 1.76, 8);
      } else if (shapeId === "triangle") {
        ctx.moveTo(0, -r * 1.02);
        ctx.lineTo(r * 0.98, r * 0.82);
        ctx.lineTo(-r * 0.98, r * 0.82);
        ctx.closePath();
      } else if (shapeId === "star") {
        const spikes = 5;
        const outer = r * 1.06;
        const inner = r * 0.48;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = i % 2 === 0 ? outer : inner;
          const angle = (i * Math.PI) / spikes - Math.PI / 2;
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }
    }

    function spawnSparkles(x, y) {
      for (let i = 0; i < 18; i++) {
        const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.2;
        const speed = 2.2 + Math.random() * 3.6;
        sparkles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.4,
          life: 36,
          color: COLORS[i % COLORS.length].fill
        });
      }
    }

    function spawnCanvasRipple(x, y, color) {
      ripples.push({ x, y, r: 8, maxR: 48, life: 22, color });
    }

    function setupRound(autoSpeak = true) {
      locked = false;
      pickedCount = 0;
      targetCount = levelMode === "easy"
        ? Math.floor(Math.random() * 3) + 1
        : Math.floor(Math.random() * 3) + 2;

      helperAnimal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
      helperHop = 18;
      const targetShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const targetColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      const badgeAnimal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];

      let useAnimal = false;
      if (levelMode === "medium") useAnimal = true;
      else if (levelMode === "mix") useAnimal = Math.random() < 0.6;

      mission = {
        shape: targetShape,
        color: targetColor,
        animal: useAnimal ? badgeAnimal : null
      };

      pickedEl.textContent = pickedCount;
      targetEl.textContent = targetCount;
      statusMsg = "Ketuk yang sesuai!";
      statusColor = "#0369a1";

      const totalCards = 9;
      const list = [];

      for (let i = 0; i < targetCount; i++) {
        list.push({
          shape: mission.shape,
          color: mission.color,
          animal: mission.animal || ANIMALS[Math.floor(Math.random() * ANIMALS.length)],
          isTarget: true
        });
      }

      while (list.length < totalCards) {
        const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const c = COLORS[Math.floor(Math.random() * COLORS.length)];
        const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];

        const matchesTarget =
          s.id === mission.shape.id &&
          c.name === mission.color.name &&
          (!mission.animal || a.emoji === mission.animal.emoji);

        if (!matchesTarget) {
          list.push({ shape: s, color: c, animal: a, isTarget: false });
        }
      }

      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }

      const cols = 3;
      const cardW = 122;
      const cardH = 104;
      const gapX = 16;
      const gapY = 14;
      const startX = (canvas.width - (cols * cardW + (cols - 1) * gapX)) / 2;
      const startY = 228;

      cards = list.map((item, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        return {
          ...item,
          x: startX + c * (cardW + gapX),
          y: startY + r * (cardH + gapY),
          w: cardW,
          h: cardH,
          picked: false,
          shake: 0,
          bounce: 0
        };
      });

      if (autoSpeak && gameScreen.classList.contains("active")) {
        setTimeout(() => speakText(getMissionSpeech()), 220);
      }
    }

    function openCountGame() {
      showScreen(gameScreen);
      setupRound(true);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!mission) {
        requestAnimationFrame(draw);
        return;
      }

      ctx.fillStyle = "#f0f9ff";
      ctx.fillRect(0, 0, canvas.width, 210);

      // Karakter pembantu dengan bounce
      let hopOffsetY = 0;
      let hopScale = 1;
      if (helperHop > 0) {
        const p = 1 - helperHop / 18;
        hopOffsetY = -Math.sin(p * Math.PI) * 14;
        hopScale = 1 + Math.sin(p * Math.PI) * 0.14;
        helperHop--;
      }

      ctx.save();
      ctx.translate(68, 96 + hopOffsetY);
      ctx.scale(hopScale, hopScale);
      ctx.font = "56px var(--font-kids)";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(helperAnimal.emoji, 0, 0);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(118, 28, 300, 156, 20);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(166, 82);
      ctx.fillStyle = mission.color.fill;
      ctx.strokeStyle = mission.color.stroke;
      ctx.lineWidth = 3;
      drawShapePath(mission.shape.id, 24);
      ctx.fill();
      ctx.stroke();

      if (mission.animal) {
        ctx.font = "24px var(--font-kids)";
        ctx.fillText(mission.animal.emoji, 20, -18);
      }
      ctx.restore();

      ctx.fillStyle = "#0f172a";
      ctx.font = "700 19px var(--font-kids)";
      ctx.textAlign = "left";
      const ruleText = mission.animal
        ? `Cari ${targetCount} ${mission.shape.name} ${mission.color.name} (${mission.animal.emoji})`
        : `Cari ${targetCount} ${mission.shape.name} ${mission.color.name}`;
      ctx.fillText(ruleText, 204, 70, 202);

      ctx.fillStyle = statusColor;
      ctx.font = "600 16px var(--font-kids)";
      ctx.fillText(statusMsg, 204, 106, 202);

      for (let i = 0; i < targetCount; i++) {
        ctx.beginPath();
        ctx.arc(214 + i * 28, 146, 9, 0, Math.PI * 2);
        ctx.fillStyle = i < pickedCount ? "#22c55e" : "#e2e8f0";
        ctx.fill();
      }

      for (const card of cards) {
        let offsetX = 0;
        let cardScale = 1;

        if (card.shake > 0) {
          offsetX = Math.sin(card.shake * 1.4) * 7;
          card.shake--;
        }

        if (card.bounce > 0) {
          const t = 1 - card.bounce / 20;
          cardScale = 1 + Math.sin(t * Math.PI * 1.4) * 0.14 * (1 - t * 0.5);
          card.bounce--;
        }

        ctx.save();
        ctx.translate(card.x + card.w / 2 + offsetX, card.y + card.h / 2);
        ctx.scale(cardScale, cardScale);
        ctx.translate(-card.w / 2, -card.h / 2);

        ctx.fillStyle = card.picked ? "#dcfce7" : "#f8fafc";
        ctx.strokeStyle = card.picked ? "#22c55e" : "#cbd5e1";
        ctx.lineWidth = card.picked ? 3.5 : 2;
        ctx.beginPath();
        ctx.roundRect(0, 0, card.w, card.h, 16);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(card.w / 2, card.h / 2 + 5);
        ctx.fillStyle = card.color.fill;
        ctx.strokeStyle = card.color.stroke;
        ctx.lineWidth = 2.5;
        drawShapePath(card.shape.id, 25);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.font = "22px var(--font-kids)";
        ctx.textAlign = "left";
        ctx.fillText(card.animal.emoji, 20, 22);

        if (card.picked) {
          ctx.font = "700 20px var(--font-kids)";
          ctx.textAlign = "right";
          ctx.fillStyle = "#16a34a";
          ctx.fillText("✓", card.w - 10, 22);
        }

        ctx.restore();
      }

      // Gelombang sentuhan (ripple)
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        const progress = 1 - rp.life / 22;
        const radius = rp.r + (rp.maxR - rp.r) * progress;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.strokeStyle = rp.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        rp.life--;
        if (rp.life <= 0) ripples.splice(i, 1);
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.12;
        sp.life--;
        ctx.globalAlpha = Math.max(0, sp.life / 36);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (sp.life <= 0) sparkles.splice(i, 1);
      }

      requestAnimationFrame(draw);
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (locked || !mission) return;
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (canvas.width / rect.width);
      const py = (e.clientY - rect.top) * (canvas.height / rect.height);

      // Ketuk hewan pembantu di kiri atas juga bikin dia melompat
      if (px >= 24 && px <= 112 && py >= 52 && py <= 140) {
        helperHop = 18;
        spawnCanvasRipple(68, 96, "#38bdf8");
        playSound([[659.25, 0, 0.1, "triangle"]]);
        return;
      }

      for (const card of cards) {
        if (px >= card.x && px <= card.x + card.w && py >= card.y && py <= card.y + card.h) {
          card.bounce = 20;
          spawnCanvasRipple(px, py, card.color.fill);

          if (card.picked) return;

          if (card.isTarget && pickedCount < targetCount) {
            card.picked = true;
            pickedCount++;
            helperHop = 14;
            pickedEl.textContent = pickedCount;
            statusColor = "#15803d";
            statusMsg = `Mantap! ${pickedCount} dari ${targetCount}`;
            spawnSparkles(card.x + card.w / 2, card.y + card.h / 2);
            playSound([[523 + pickedCount * 75, 0, 0.13, "triangle"]]);

            if (pickedCount === targetCount) {
              locked = true;
              helperHop = 22;
              stars++;
              starsEl.textContent = stars;
              localStorage.setItem("tk_hitung_stars", stars);
              statusMsg = "Hebat! Dapat 1 bintang ⭐";
              playSound([
                [523.25, 0, 0.12, "triangle"],
                [659.25, 0.1, 0.12, "triangle"],
                [783.99, 0.2, 0.22, "triangle"]
              ]);
              const playerName = (localStorage.getItem(NAME_KEY) || "").trim();
              speakText(playerName ? `Hebat sekali ${playerName}! Kamu dapat bintang` : "Hebat sekali! Kamu dapat bintang");
              setTimeout(() => setupRound(true), 1250);
            }
          } else {
            card.shake = 14;
            statusColor = "#b45309";
            statusMsg = "Coba perhatikan warna, bentuk & hewan";
            playSound([[220, 0, 0.14, "sine"]]);
          }
          break;
        }
      }
    });

    voiceBtn.addEventListener("click", () => {
      triggerBounce(voiceBtn);
      helperHop = 16;
      speakText(getMissionSpeech());
    });

    lvlBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        lvlBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        triggerBounce(btn);
        levelMode = btn.dataset.level;
        setupRound(true);
      });
    });

    refreshMoodButtons();
    syncQuickContinue();
    setupRound(false);
    draw();
    showScreen(splashScreen);
  </script>
</body>
</html>
