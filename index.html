<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#84cc16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hitung TK" />
  <title>Ayo Main & Belajar TK</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-display: "Baloo 2", "Fredoka", "Comic Sans MS", system-ui, sans-serif;
      --font-kids: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
      --bg-cream: #f4f1ea;
      --ink-dark: #182026;
      --ink-muted: #5c636a;
      --lime-pop: #84cc16;
      --lime-dark: #4d7c0f;
      --navy-pop: #0f172a;
      --periwinkle: #818cf8;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-kids);
    }

    body {
      background: #eae6dd;
      color: var(--ink-dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: screenPop 0.28s var(--ease-bounce);
    }

    @keyframes screenPop {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes jellyBounce {
      0% { transform: scale(1, 1) translateY(0); }
      28% { transform: scale(1.12, 0.88) translateY(3px); }
      55% { transform: scale(0.94, 1.07) translateY(-7px); }
      78% { transform: scale(1.03, 0.98) translateY(-1px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    @keyframes floatBlob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .bounce-now {
      animation: jellyBounce 0.45s var(--ease-bounce) !important;
    }

    /* LAYAR 1: SPLASH & ISI NAMA */
    .splash-card {
      position: relative;
      width: 100%;
      min-height: 620px;
      background: var(--bg-cream);
      border-radius: 30px;
      border: 3px solid #dcd6c8;
      box-shadow: 0 14px 32px rgba(24, 32, 38, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-blobs {
      position: relative;
      height: 118px;
      width: 100%;
      pointer-events: none;
    }

    .blob-lime {
      position: absolute;
      top: -34px;
      left: -26px;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: var(--lime-pop);
      box-shadow: inset -6px -8px 16px rgba(77, 124, 15, 0.28);
      animation: floatBlob 4.2s ease-in-out infinite;
    }

    .blob-navy {
      position: absolute;
      top: 18px;
      left: 196px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--navy-pop);
      box-shadow: inset 3px 3px 8px rgba(255, 255, 255, 0.16);
      animation: floatBlob 3.4s ease-in-out 0.5s infinite;
    }

    .blob-blue {
      position: absolute;
      top: -18px;
      right: -28px;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: var(--periwinkle);
      box-shadow: inset -5px -7px 14px rgba(55, 48, 163, 0.28);
      animation: floatBlob 4.8s ease-in-out 0.9s infinite;
    }

    .splash-body {
      position: relative;
      z-index: 2;
      padding: 2px 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .splash-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.03;
      color: var(--ink-dark);
    }

    .splash-sub {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.32;
      color: var(--ink-muted);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .splash-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 16px;
      border: 2.5px solid #cbd5e1;
      background: #ffffff;
      color: var(--ink-dark);
      font-family: var(--font-display);
      font-size: 1.16rem;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
      outline: none;
      transition: border-color 0.15s ease, transform 0.2s var(--ease-bounce);
    }

    .splash-input:focus {
      border-color: var(--lime-dark);
      transform: scale(1.01);
    }

    .question-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .q-pill {
      padding: 8px 6px;
      border-radius: 15px;
      border: 2.5px solid #d6d0c0;
      background: #ffffff;
      color: var(--ink-dark);
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.22s var(--ease-bounce), background 0.15s ease, border-color 0.15s ease;
    }

    .q-pill:active {
      transform: scale(0.92);
    }

    .q-pill.active {
      background: #ecfccb;
      border-color: var(--lime-dark);
      color: #365314;
      transform: translateY(-2px) scale(1.03);
    }

    .btn-primary-dark {
      width: 100%;
      padding: 13px 16px;
      border-radius: 16px;
      border: none;
      background: var(--navy-pop);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 1.18rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #334155;
      transition: transform 0.22s var(--ease-bounce), box-shadow 0.12s ease;
    }

    .btn-primary-dark:active {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 1px 0 #334155;
    }

    .btn-secondary-cream {
      width: 100%;
      padding: 10px 16px;
      border-radius: 16px;
      border: 2.5px solid #cbd5e1;
      background: #faf8f3;
      color: var(--ink-dark);
      font-family: var(--font-display);
      font-size: 1.04rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.22s var(--ease-bounce);
    }

    .btn-secondary-cream:active {
      transform: scale(0.97);
    }

    .btn-secondary-cream.hidden {
      display: none;
    }

    .form-msg {
      min-height: 18px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #dc2626;
      text-align: center;
    }

    /* Karakter hijau 3D lucu di bagian bawah */
    .bottom-monster {
      position: relative;
      width: 100%;
      height: 130px;
      margin-top: 2px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-origin: bottom center;
    }

    .bottom-monster.hop {
      animation: monsterHop 0.55s var(--ease-bounce);
    }

    @keyframes monsterHop {
      0% { transform: scale(1, 1) translateY(0); }
      22% { transform: scale(1.14, 0.84) translateY(6px); }
      52% { transform: scale(0.93, 1.1) translateY(-18px); }
      78% { transform: scale(1.05, 0.96) translateY(-3px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .monster-dome {
      width: 116%;
      height: 142px;
      background: radial-gradient(circle at 50% 24%, #a3e635 0%, #84cc16 58%, #65a30d 100%);
      border-top-left-radius: 50% 72%;
      border-top-right-radius: 50% 72%;
      box-shadow: inset 0 8px 18px rgba(255, 255, 255, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
    }

    .monster-tuft {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 18px;
      background: #84cc16;
      border-radius: 14px 14px 0 0;
    }

    .monster-eyes {
      display: flex;
      gap: 24px;
      margin-top: 6px;
    }

    .eye-socket {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .brow {
      width: 22px;
      height: 5px;
      background: #0f172a;
      border-radius: 999px;
      transition: transform 0.25s var(--ease-bounce);
    }

    .brow.left { transform: rotate(-10deg); }
    .brow.right { transform: rotate(10deg); }

    .bottom-monster.hop .brow.left { transform: rotate(-18deg) translateY(-3px); }
    .bottom-monster.hop .brow.right { transform: rotate(18deg) translateY(-3px); }

    .eyeball {
      width: 56px;
      height: 56px;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1f5f9 85%, #cbd5e1 100%);
      border-radius: 50%;
      border: 3px solid #0f172a;
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.14s ease;
    }

    .eyeball.blink {
      transform: scaleY(0.12);
    }

    .pupil {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 35% 30%, #334155 0%, #0f172a 75%);
      border-radius: 50%;
      position: relative;
      transition: transform 0.08s linear;
    }

    .pupil::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 4px;
      width: 7px;
      height: 7px;
      background: #ffffff;
      border-radius: 50%;
    }

    .nostrils {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .nostril {
      width: 7px;
      height: 6px;
      background: #3f6212;
      border-radius: 50%;
    }

    /* LAYAR 2: LOBBY 6 KARTU MODERN 3D */
    .lobby-header {
      width: 100%;
      background: #ffffff;
      border: 2.5px solid #e2ddd2;
      border-radius: 24px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(24, 32, 38, 0.07);
    }

    .greeting-main {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--ink-dark);
      line-height: 1.12;
    }

    .greeting-sub {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .small-btn {
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      color: var(--ink-dark);
      font-family: var(--font-display);
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s var(--ease-bounce);
    }

    .small-btn:active {
      transform: scale(0.92);
    }

    .games-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game-card-modern {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      padding: 12px 12px 14px;
      min-height: 170px;
      border: 2.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 18px rgba(24, 32, 38, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      cursor: pointer;
      transition: transform 0.24s var(--ease-bounce), box-shadow 0.2s ease;
    }

    .game-card-modern:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(24, 32, 38, 0.12);
    }

    .game-card-modern:active {
      transform: scale(0.94);
    }

    .card-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .corner-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .status-chip {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink-dark);
    }

    .game-card-modern.is-ready .status-chip {
      background: #0f172a;
      color: #ffffff;
    }

    .art-stage {
      width: 100%;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .card-bottom-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      z-index: 2;
    }

    .card-title-bold {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 800;
      line-height: 1.12;
      color: var(--ink-dark);
    }

    .card-sub-muted {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .tap-ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: translate(-50%, -50%) scale(0.2);
      animation: rippleBurst 0.48s ease-out forwards;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes rippleBurst {
      0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(5.5); }
    }

    .idea-banner {
      width: 100%;
      background: #ffffff;
      border: 2.5px solid #e2ddd2;
      border-radius: 18px;
      padding: 10px 14px;
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--ink-dark);
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(24, 32, 38, 0.05);
    }

    /* LAYAR 3: GAME AKTIF */
    .top-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.96rem;
    }

    .pill {
      background: #ffffff;
      border: 2.5px solid #7dd3fc;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #38bdf8;
      white-space: nowrap;
      color: var(--ink-dark);
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce);
    }

    .pill:active {
      transform: scale(0.92);
    }

    .level-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .lvl-btn {
      flex: 1;
      padding: 7px 6px;
      border-radius: 14px;
      border: 2.5px solid #93c5fd;
      background: #ffffff;
      color: #1e3a8a;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce), background 0.15s ease;
    }

    .lvl-btn:active {
      transform: scale(0.94);
    }

    .lvl-btn.active {
      background: #0284c7;
      border-color: #0369a1;
      color: #ffffff;
      box-shadow: 0 2px 0 #075985;
      transform: translateY(-1px);
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 26px;
      overflow: hidden;
      border: 3px solid #0284c7;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.18);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- LAYAR 1: TAMPILAN PERTAMA -->
    <section id="splashScreen" class="screen">
      <div class="splash-card">
        <div class="top-blobs">
          <div class="blob-lime"></div>
          <div class="blob-navy"></div>
          <div class="blob-blue"></div>
        </div>

        <div class="splash-body">
          <h1 class="splash-title">Ayo main &amp; hitung seru!</h1>
          <p class="splash-sub">Kenali bentuk, warna, dan angka. Tulis namamu dulu ya!</p>

          <div class="input-group">
            <label for="playerNameInput" class="input-label">Nama kamu siapa?</label>
            <input
              id="playerNameInput"
              class="splash-input"
              type="text"
              maxlength="18"
              placeholder="Ketik nama kamu..."
              autocomplete="off"
            />
          </div>

          <div class="input-group">
            <div class="input-label">Hari ini lagi gimana?</div>
            <div class="question-pills" id="moodPills">
              <button type="button" class="q-pill active" data-mood="Ceria">😄 Ceria</button>
              <button type="button" class="q-pill" data-mood="Seru">🤩 Seru</button>
              <button type="button" class="q-pill" data-mood="Siap">🚀 Siap</button>
            </div>
          </div>

          <div id="splashMsg" class="form-msg"></div>

          <button id="saveStartBtn" type="button" class="btn-primary-dark">Mulai &amp; Pilih Game</button>
          <button id="quickContinueBtn" type="button" class="btn-secondary-cream hidden">Lanjut Sebagai ...</button>
        </div>

        <div id="monsterBuddy" class="bottom-monster" title="Ketuk aku!" aria-label="Karakter hijau lucu">
          <div class="monster-dome">
            <div class="monster-tuft"></div>
            <div class="monster-eyes">
              <div class="eye-socket">
                <div class="brow left"></div>
                <div class="eyeball"><div class="pupil"></div></div>
              </div>
              <div class="eye-socket">
                <div class="brow right"></div>
                <div class="eyeball"><div class="pupil"></div></div>
              </div>
            </div>
            <div class="nostrils">
              <div class="nostril"></div>
              <div class="nostril"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- LAYAR 2: 6 KARTU MODERN 3D -->
    <section id="lobbyScreen" class="screen">
      <div class="lobby-header">
        <div>
          <div id="lobbyGreeting" class="greeting-main">Halo, Teman!</div>
          <div id="lobbySub" class="greeting-sub">Pilih 1 dari 6 kartu game</div>
        </div>
        <button id="changeNameBtn" type="button" class="small-btn">✏️ Nama</button>
      </div>

      <div id="gamesGrid" class="games-grid"></div>

      <div id="ideaBanner" class="idea-banner">
        💡 Kartu 1 &amp; Kartu 2 siap dimainkan!
      </div>
    </section>

    <!-- LAYAR 3: GAME AKTIF -->
    <section id="gameScreen" class="screen">
      <div class="top-hud">
        <button id="backLobbyBtn" type="button" class="pill" style="background:#f1f5f9; border-color:#94a3b8; box-shadow:0 3px 0 #64748b;">← Menu</button>
        <div class="pill">⭐ <span id="starsEl">0</span></div>
        <div class="pill" id="progressPill">🎯 <span id="pickedEl">0</span>/<span id="targetEl">2</span></div>
        <button id="sfxToggleBtn" type="button" class="pill" style="background:#fef9c3; border-color:#facc15; box-shadow:0 3px 0 #eab308;">🔊</button>
      </div>

      <div id="levelBar" class="level-bar">
        <button type="button" class="lvl-btn active" data-level="easy">Mudah</button>
        <button type="button" class="lvl-btn" data-level="medium">Sedang</button>
        <button type="button" class="lvl-btn" data-level="mix">Campuran</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="440" height="586"></canvas>
      </div>
    </section>
  </div>

  <script>
    const splashScreen = document.getElementById("splashScreen");
    const lobbyScreen = document.getElementById("lobbyScreen");
    const gameScreen = document.getElementById("gameScreen");

    const playerNameInput = document.getElementById("playerNameInput");
    const moodPills = document.querySelectorAll(".q-pill");
    const splashMsg = document.getElementById("splashMsg");
    const saveStartBtn = document.getElementById("saveStartBtn");
    const quickContinueBtn = document.getElementById("quickContinueBtn");

    const monsterBuddy = document.getElementById("monsterBuddy");
    const pupils = document.querySelectorAll(".pupil");

    function triggerBounce(el) {
      if (!el) return;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(notes) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        notes.forEach(([freq, delay, dur, type = "sine", slideTo = null]) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now + delay);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + delay + dur);
          }
          gain.gain.setValueAtTime(0.14, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur);
        });
      } catch (_) {}
    }

    function traceShapePath(shapeId, r) {
      ctx.beginPath();
      if (shapeId === "circle") {
        ctx.arc(0, 0, r, 0, Math.PI * 2);
      } else if (shapeId === "square") {
        ctx.roundRect(-r * 0.88, -r * 0.88, r * 1.76, r * 1.76, Math.max(8, r * 0.34));
      } else if (shapeId === "triangle") {
        ctx.moveTo(0, -r * 1.05);
        ctx.lineTo(r * 0.98, r * 0.82);
        ctx.lineTo(-r * 0.98, r * 0.82);
        ctx.closePath();
      } else if (shapeId === "star") {
        const spikes = 5;
        const outer = r * 1.08;
        const inner = r * 0.5;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = i % 2 === 0 ? outer : inner;
          const angle = (i * Math.PI) / spikes - Math.PI / 2;
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }
    }

    function draw3DShape(shapeId, r, colorObj, depth = 6) {
      ctx.save();

      ctx.save();
      ctx.translate(0, depth);
      traceShapePath(shapeId, r);
      ctx.fillStyle = colorObj.dark;
      ctx.fill();
      ctx.restore();

      const grad = ctx.createLinearGradient(-r * 0.6, -r * 0.8, r * 0.6, r * 0.9);
      grad.addColorStop(0, colorObj.light);
      grad.addColorStop(0.45, colorObj.fill);
      grad.addColorStop(1, colorObj.dark);

      traceShapePath(shapeId, r);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.lineWidth = 2.2;
      ctx.strokeStyle = colorObj.dark;
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.28, -r * 0.34, r * 0.25, r * 0.12, -0.45, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHelperBuddy(buddy, x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      const s = size / 44;
      ctx.scale(s, s);

      if (buddy.id === "bunny") {
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.ellipse(-9, -16, 5.5, 12.5, -0.15, 0, Math.PI * 2);
        ctx.ellipse(9, -16, 5.5, 12.5, 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = buddy.fur;
        ctx.beginPath();
        ctx.ellipse(-9, -18, 5, 12, -0.15, 0, Math.PI * 2);
        ctx.ellipse(9, -18, 5, 12, 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = buddy.ear;
        ctx.beginPath();
        ctx.ellipse(-9, -18, 2.6, 8, -0.15, 0, Math.PI * 2);
        ctx.ellipse(9, -18, 2.6, 8, 0.15, 0, Math.PI * 2);
        ctx.fill();
      } else if (buddy.id === "cat") {
        ctx.fillStyle = buddy.ear;
        ctx.beginPath();
        ctx.moveTo(-16, -6); ctx.lineTo(-12, -21); ctx.lineTo(-3, -12); ctx.closePath();
        ctx.moveTo(16, -6); ctx.lineTo(12, -21); ctx.lineTo(3, -12); ctx.closePath();
        ctx.fill();
      } else if (buddy.id === "frog") {
        ctx.fillStyle = buddy.fur;
        ctx.beginPath();
        ctx.arc(-10, -14, 7.5, 0, Math.PI * 2);
        ctx.arc(10, -14, 7.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = buddy.dark;
      ctx.beginPath();
      ctx.arc(0, 2.5, 16.5, 0, Math.PI * 2);
      ctx.fill();

      const headGrad = ctx.createRadialGradient(-5, -8, 2, 0, 0, 19);
      headGrad.addColorStop(0, "#ffffff");
      headGrad.addColorStop(0.3, buddy.fur);
      headGrad.addColorStop(1, buddy.dark);

      ctx.beginPath();
      ctx.arc(0, 0, 16.5, 0, Math.PI * 2);
      ctx.fillStyle = headGrad;
      ctx.fill();

      const eyeY = buddy.id === "frog" ? -14 : -3;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-6, eyeY, 4.6, 0, Math.PI * 2);
      ctx.arc(6, eyeY, 4.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(-5.5, eyeY, 2.6, 0, Math.PI * 2);
      ctx.arc(6.5, eyeY, 2.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-6.4, eyeY - 1, 1, 0, Math.PI * 2);
      ctx.arc(5.6, eyeY - 1, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(244, 114, 182, 0.58)";
      ctx.beginPath();
      ctx.arc(-10, 3, 3.4, 0, Math.PI * 2);
      ctx.arc(10, 3, 3.4, 0, Math.PI * 2);
      ctx.fill();

      if (buddy.id === "chick") {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(-4.5, 2); ctx.lineTo(4.5, 2); ctx.lineTo(0, 7.5); ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.arc(0, 2, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-3, 5, 3, 0.1, Math.PI - 0.1);
        ctx.arc(3, 5, 3, 0.1, Math.PI - 0.1);
        ctx.stroke();
      }

      ctx.restore();
    }

    function spawnSparkles(x, y, count = 18, speedScale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.25;

          life: 38 + Math.floor(Math.random() * 12),

    let g1StatusMsg = "Ketuk bentuk yang sesuai!";
    let g1StatusColor = "#0369a1";
    let g1Locked = false;

    function setupGame1() {
      g1Locked = false;
      g1PickedCount = 0;

      if (g1Level === "easy") {
        g1TargetCount = Math.floor(Math.random() * 3) + 1;
      } else if (g1Level === "medium") {
        g1TargetCount = Math.floor(Math.random() * 3) + 2;
      } else {
        g1TargetCount = Math.floor(Math.random() * 4) + 2;
      }

      helperBuddy = HELPER_BUDDIES[Math.floor(Math.random() * HELPER_BUDDIES.length)];
      helperHop = 18;
      g1Mission = {
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      };

      pickedEl.textContent = g1PickedCount;
      targetEl.textContent = g1TargetCount;
      g1StatusMsg = "Ketuk bentuk yang sesuai!";
      g1StatusColor = "#0369a1";

      const totalCards = 9;
      const list = [];
      for (let i = 0; i < g1TargetCount; i++) {
        list.push({ shape: g1Mission.shape, color: g1Mission.color, isTarget: true });
      }
      while (list.length < totalCards) {
        const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const c = COLORS[Math.floor(Math.random() * COLORS.length)];
        if (!(s.id === g1Mission.shape.id && c.name === g1Mission.color.name)) {
          list.push({ shape: s, color: c, isTarget: false });
        }
      }
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }

      const cols = 3;
      const cardW = 122;
      const cardH = 104;
      const gapX = 16;
      const gapY = 14;
      const startX = (canvas.width - (cols * cardW + (cols - 1) * gapX)) / 2;
      const startY = 228;

      g1Cards = list.map((item, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        return {
          ...item,
          x: startX + c * (cardW + gapX),
          y: startY + r * (cardH + gapY),
          w: cardW,
          h: cardH,
          picked: false,
          shake: 0,
          bounce: 0
        };
      });
    }

    function drawGame1(hopOffsetY, hopScale) {
      ctx.fillStyle = "#f0f9ff";
      ctx.fillRect(0, 0, canvas.width, 210);

      ctx.save();
      ctx.translate(68, 98 + hopOffsetY);
      ctx.scale(hopScale, hopScale);
      drawHelperBuddy(helperBuddy, 0, 0, 64);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(118, 28, 300, 156, 22);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(164, 86);
      draw3DShape(g1Mission.shape.id, 25, g1Mission.color);
      ctx.restore();

      ctx.fillStyle = "#0f172a";
      ctx.font = "800 20px 'Baloo 2', 'Fredoka', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`Cari ${g1TargetCount} ${g1Mission.shape.name} ${g1Mission.color.name}`, 204, 70, 202);

      ctx.fillStyle = g1StatusColor;
      ctx.font = "700 16px 'Fredoka', sans-serif";
      ctx.fillText(g1StatusMsg, 204, 106, 202);

      for (let i = 0; i < g1TargetCount; i++) {
        ctx.beginPath();
        ctx.arc(214 + i * 28, 146, 9, 0, Math.PI * 2);
        ctx.fillStyle = i < g1PickedCount ? "#22c55e" : "#e2e8f0";
        ctx.fill();
      }

      for (const card of g1Cards) {
        let offsetX = 0;
        let cardScale = 1;
        if (card.shake > 0) {
          offsetX = Math.sin(card.shake * 1.4) * 7;
          card.shake--;
        }
        if (card.bounce > 0) {
          const t = 1 - card.bounce / 20;
          cardScale = 1 + Math.sin(t * Math.PI * 1.4) * 0.14 * (1 - t * 0.5);
          card.bounce--;
        }

        ctx.save();
        ctx.translate(card.x + card.w / 2 + offsetX, card.y + card.h / 2);
        ctx.scale(cardScale, cardScale);
        ctx.translate(-card.w / 2, -card.h / 2);

        ctx.fillStyle = card.picked ? "#86efac" : "#e2e8f0";
        ctx.beginPath();
        ctx.roundRect(0, 4, card.w, card.h, 20);
        ctx.fill();

        ctx.fillStyle = card.picked ? "#dcfce7" : "#f8fafc";
        ctx.strokeStyle = card.picked ? "#22c55e" : "#cbd5e1";
        ctx.lineWidth = card.picked ? 3.5 : 2;
        ctx.beginPath();
        ctx.roundRect(0, 0, card.w, card.h, 20);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(card.w / 2, card.h / 2 + 2);
        draw3DShape(card.shape.id, 30, card.color);
        ctx.restore();

        if (card.picked) {
          ctx.font = "800 22px 'Baloo 2', sans-serif";
          ctx.textAlign = "right";
          ctx.fillStyle = "#16a34a";
          ctx.fillText("✓", card.w - 11, 24);
        }

        ctx.restore();
      }
    }

    function handleGame1PointerDown(px, py) {
      if (g1Locked || !g1Mission) return;
      if (px >= 24 && px <= 112 && py >= 52 && py <= 140) {
        helperHop = 18;
        spawnCanvasRipple(68, 98, "#38bdf8");
        playBoingSfx();
        return;
      }

      for (const card of g1Cards) {
        if (px >= card.x && px <= card.x + card.w && py >= card.y && py <= card.y + card.h) {
          card.bounce = 20;
          spawnCanvasRipple(px, py, card.color.fill);

          if (card.picked) {
            playPopSfx(200);
            return;
          }

          if (card.isTarget && g1PickedCount < g1TargetCount) {
            card.picked = true;
            g1PickedCount++;
            helperHop = 14;
            pickedEl.textContent = g1PickedCount;
            g1StatusColor = "#15803d";
            g1StatusMsg = `Mantap! ${g1PickedCount} dari ${g1TargetCount}`;
            spawnSparkles(card.x + card.w / 2, card.y + card.h / 2);
            playPopSfx(g1PickedCount * 95);

            if (g1PickedCount === g1TargetCount) {
              g1Locked = true;
              helperHop = 22;
              awardStar("Hebat! Dapat 1 bintang ⭐");
              playBoomSfx();
              setTimeout(setupGame1, 1150);
            }
          } else {
            card.shake = 14;
            g1StatusColor = "#b45309";
            g1StatusMsg = "Coba perhatikan bentuk & warnanya";
            playThudSfx();
          }
          break;
        }
      }
    }

    // --- GAME 2: Gabung Bentuk (Geser ke Bentuk Sama -> Membesar -> Meledak) ---
    let g2Level = "easy";
    let g2MergesNeeded = 3;
    let g2MergeCount = 0;
    let g2FocusPiece = null;
    let g2Pieces = [];
    let g2DraggingPiece = null;
    let g2DragOffset = { x: 0, y: 0 };
    let g2StatusMsg = "Geser bentuk ke bentuk yang sama!";
    let g2StatusColor = "#15803d";
    let g2Locked = false;
    let g2ShakeTimer = 0;

    function getMergesByLevel() {
      if (g2Level === "easy") return 3;
      if (g2Level === "medium") return 4;
      return 5;
    }

    function getBaseRadiusForMergeStep(step) {
      return 24 + step * 8.5;
    }

    function setupGame2() {
      g2Locked = false;
      g2DraggingPiece = null;
      g2MergeCount = 0;
      g2MergesNeeded = getMergesByLevel();

      helperBuddy = HELPER_BUDDIES[Math.floor(Math.random() * HELPER_BUDDIES.length)];
      helperHop = 18;

      const focusShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const focusColor = COLORS[Math.floor(Math.random() * COLORS.length)];

      pickedEl.textContent = g2MergeCount;
      targetEl.textContent = g2MergesNeeded;
      g2StatusMsg = "Geser ke bentuk yang sama!";
      g2StatusColor = "#15803d";

      // Bentuk utama di tengah arena yang akan membesar tiap kali digabung
      g2FocusPiece = {
        id: "focus",
        shape: focusShape,
        color: focusColor,
        x: canvas.width / 2,
        y: 355,
        baseR: getBaseRadiusForMergeStep(0),
        scaleAnim: 1.18,
        pulse: 0
      };

      // Beberapa bentuk berbeda + beberapa bentuk sama untuk digeser
      const slots = [
        { x: 82, y: 248 },
        { x: 220, y: 242 },
        { x: 358, y: 248 },
        { x: 76, y: 365 },
        { x: 364, y: 365 },
        { x: 84, y: 486 },
        { x: 220, y: 502 },
        { x: 356, y: 486 }
      ];

      for (let i = slots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [slots[i], slots[j]] = [slots[j], slots[i]];
      }

      const pieces = [];
      // Pastikan jumlah bentuk yang sama cukup untuk mencapai target ledakan
      for (let i = 0; i < g2MergesNeeded + 1; i++) {
        const sl = slots[i];
        pieces.push({
          id: `match-${i}`,
          shape: focusShape,
          color: focusColor,
          x: sl.x,
          y: sl.y,
          homeX: sl.x,
          homeY: sl.y,
          r: 22,
          isMatch: true,
          shake: 0
        });
      }

      // Isi sisa slot dengan bentuk atau warna yang berbeda
      for (let i = g2MergesNeeded + 1; i < slots.length; i++) {
        const sl = slots[i];
        let s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        let c = COLORS[Math.floor(Math.random() * COLORS.length)];
        if (s.id === focusShape.id && c.name === focusColor.name) {
          s = SHAPES[(SHAPES.findIndex((item) => item.id === s.id) + 1) % SHAPES.length];
        }
        pieces.push({
          id: `other-${i}`,
          shape: s,
          color: c,
          x: sl.x,
          y: sl.y,
          homeX: sl.x,
          homeY: sl.y,
          r: 22,
          isMatch: false,
          shake: 0
        });
      }

      g2Pieces = pieces;
    }

    function drawGame2(hopOffsetY, hopScale) {
      ctx.fillStyle = "#f0fdf4";
      ctx.fillRect(0, 0, canvas.width, 206);

      ctx.fillStyle = "#dcfce7";
      ctx.fillRect(0, 206, canvas.width, canvas.height - 206);

      // Karakter penyemangat di kiri atas
      ctx.save();
      ctx.translate(68, 96 + hopOffsetY);
      ctx.scale(hopScale, hopScale);
      drawHelperBuddy(helperBuddy, 0, 0, 62);
      ctx.restore();

      // Panel misi atas
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#86efac";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(118, 26, 300, 156, 22);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(162, 84);
      draw3DShape(g2FocusPiece.shape.id, 22, g2FocusPiece.color, 5);
      ctx.restore();

      ctx.fillStyle = "#0f172a";
      ctx.font = "800 19px 'Baloo 2', 'Fredoka', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`Gabung ${g2MergesNeeded}x ${g2FocusPiece.shape.name}`, 202, 66, 204);

      ctx.fillStyle = g2StatusColor;
      ctx.font = "700 15px 'Fredoka', sans-serif";
      ctx.fillText(g2StatusMsg, 202, 102, 204);

      // Indikator ukuran / penyatuan
      for (let i = 0; i < g2MergesNeeded; i++) {
        ctx.beginPath();
        ctx.arc(212 + i * 26, 144, 8.5, 0, Math.PI * 2);
        ctx.fillStyle = i < g2MergeCount ? "#f97316" : "#e2e8f0";
        ctx.fill();
      }

      // Lingkaran zona gabung lembut di tengah arena
      if (!g2Locked) {
        const zoneR = g2FocusPiece.baseR + 24;
        ctx.save();
        ctx.strokeStyle = g2DraggingPiece ? "#16a34a" : "rgba(34, 197, 94, 0.35)";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 7]);
        ctx.beginPath();
        ctx.arc(g2FocusPiece.x, g2FocusPiece.y, zoneR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Bentuk sasaran utama yang membesar tiap kali digabung
        if (g2FocusPiece.scaleAnim > 1) {
          g2FocusPiece.scaleAnim = Math.max(1, g2FocusPiece.scaleAnim - 0.025);
        }
        ctx.save();
        ctx.translate(g2FocusPiece.x, g2FocusPiece.y);
        ctx.scale(g2FocusPiece.scaleAnim, g2FocusPiece.scaleAnim);
        draw3DShape(
          g2FocusPiece.shape.id,
          g2FocusPiece.baseR,
          g2FocusPiece.color,
          6 + g2MergeCount * 1.5
        );
        ctx.restore();
      }

      // Gambar potongan bentuk yang bisa digeser
      for (const p of g2Pieces) {
        if (p === g2DraggingPiece) continue;
        let ox = 0;
        if (p.shake > 0) {
          ox = Math.sin(p.shake * 1.5) * 6;
          p.shake--;
        }
        ctx.save();
        ctx.translate(p.x + ox, p.y);
        draw3DShape(p.shape.id, p.r, p.color, 5);
        ctx.restore();
      }

      // Gambar potongan yang sedang ditarik di lapisan paling atas
      if (g2DraggingPiece) {
        ctx.save();
        ctx.translate(g2DraggingPiece.x, g2DraggingPiece.y);
        ctx.scale(1.15, 1.15);
        draw3DShape(g2DraggingPiece.shape.id, g2DraggingPiece.r, g2DraggingPiece.color, 8);
        ctx.restore();
      }
    }

    function handleGame2PointerDown(px, py) {
      if (g2Locked || !g2FocusPiece) return;

      if (px >= 24 && px <= 112 && py >= 50 && py <= 138) {
        helperHop = 18;
        spawnCanvasRipple(68, 96, "#4ade80");
        playBoingSfx();
        return;
      }

      // Cek bentuk yang disentuh (dari paling depan)
      for (let i = g2Pieces.length - 1; i >= 0; i--) {
        const p = g2Pieces[i];
        const dist = Math.hypot(px - p.x, py - p.y);
        if (dist <= p.r + 14) {
          g2DraggingPiece = p;
          g2DragOffset = { x: px - p.x, y: py - p.y };
          playPopSfx(70);
          break;
        }
      }
    }

    function handleGame2PointerMove(px, py) {
      if (!g2DraggingPiece || g2Locked) return;
      g2DraggingPiece.x = Math.max(32, Math.min(canvas.width - 32, px - g2DragOffset.x));
      g2DraggingPiece.y = Math.max(228, Math.min(canvas.height - 32, py - g2DragOffset.y));
    }

    function handleGame2PointerUp() {
      if (!g2DraggingPiece || g2Locked) return;
      const p = g2DraggingPiece;
      g2DraggingPiece = null;

      const distToCenter = Math.hypot(p.x - g2FocusPiece.x, p.y - g2FocusPiece.y);
      const mergeThreshold = g2FocusPiece.baseR + p.r + 22;

      if (distToCenter <= mergeThreshold) {
        const sameShape = p.shape.id === g2FocusPiece.shape.id;
        const sameColor = p.color.name === g2FocusPiece.color.name;

        if (sameShape && sameColor) {
          // Hapus bentuk yang disatukan dan besarkan bentuk utama
          g2Pieces = g2Pieces.filter((item) => item.id !== p.id);
          g2MergeCount++;
          pickedEl.textContent = g2MergeCount;
          helperHop = 14;
          spawnSparkles(g2FocusPiece.x, g2FocusPiece.y, 16, 0.9);
          spawnCanvasRipple(g2FocusPiece.x, g2FocusPiece.y, g2FocusPiece.color.fill, 64);

          if (g2MergeCount >= g2MergesNeeded) {
            // Meledak setelah mencapai batas penyatuan!
            g2Locked = true;
            g2ShakeTimer = 14;
            helperHop = 24;
            spawnSparkles(g2FocusPiece.x, g2FocusPiece.y, 44, 1.65);
            spawnCanvasRipple(g2FocusPiece.x, g2FocusPiece.y, "#facc15", 130);
            awardStar("BOOOOM! Dapat 1 bintang ⭐");
            playBoomSfx();
            setTimeout(setupGame2, 1300);
          } else {
            g2FocusPiece.baseR = getBaseRadiusForMergeStep(g2MergeCount);
            g2FocusPiece.scaleAnim = 1.24;
            g2StatusColor = "#15803d";
            g2StatusMsg = `Makin besar! (${g2MergeCount}/${g2MergesNeeded})`;
            playPopSfx(g2MergeCount * 115);
          }
          return;
        } else {
          // Salah bentuk atau warna: kembali ke posisi asal dengan getaran
          p.shake = 14;
          p.x = p.homeX;
          p.y = p.homeY;
          g2StatusColor = "#b45309";
          g2StatusMsg = `Cari ${g2FocusPiece.shape.name} yang sama!`;
          playThudSfx();
          return;
        }
      }

      // Kembali halus ke posisi awal kalau dilepas di luar zona gabung
      p.x = p.homeX;
      p.y = p.homeY;
    }

    function openSelectedGame(gameId) {
      activeGameId = gameId;
      showScreen(gameScreen);
      if (gameId === "game-1") {
        setupGame1();
      } else {
        setupGame2();
      }
    }

    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        px: (e.clientX - rect.left) * (canvas.width / rect.width),
        py: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      const { px, py } = getCanvasPoint(e);
      if (activeGameId === "game-1") {
        handleGame1PointerDown(px, py);
      } else {
        handleGame2PointerDown(px, py);
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (activeGameId !== "game-2") return;
      const { px, py } = getCanvasPoint(e);
      handleGame2PointerMove(px, py);
    });

    canvas.addEventListener("pointerup", () => {
      if (activeGameId === "game-2") {
        handleGame2PointerUp();
      }
    });

    canvas.addEventListener("pointercancel", () => {
      if (activeGameId === "game-2" && g2DraggingPiece) {
        g2DraggingPiece.x = g2DraggingPiece.homeX;
        g2DraggingPiece.y = g2DraggingPiece.homeY;
        g2DraggingPiece = null;
      }
    });

    lvlBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        lvlBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        triggerBounce(btn);
        playPopSfx(100);
        if (activeGameId === "game-1") {
          g1Level = btn.dataset.level;
          setupGame1();
        } else {
          g2Level = btn.dataset.level;
          setupGame2();
        }
      });
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      if (g2ShakeTimer > 0) {
        const sx = Math.sin(g2ShakeTimer * 2.2) * 6;
        const sy = Math.cos(g2ShakeTimer * 1.9) * 5;
        ctx.translate(sx, sy);
        g2ShakeTimer--;
      }

      let hopOffsetY = 0;
      let hopScale = 1;
      if (helperHop > 0) {
        const p = 1 - helperHop / 18;
        hopOffsetY = -Math.sin(p * Math.PI) * 14;
        hopScale = 1 + Math.sin(p * Math.PI) * 0.14;
        helperHop--;
      }

      if (activeGameId === "game-1" && g1Mission) {
        drawGame1(hopOffsetY, hopScale);
      } else if (activeGameId === "game-2" && g2FocusPiece) {
        drawGame2(hopOffsetY, hopScale);
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        const progress = 1 - rp.life / 22;
        const radius = rp.r + (rp.maxR - rp.r) * progress;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.strokeStyle = rp.color;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        rp.life--;
        if (rp.life <= 0) ripples.splice(i, 1);
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.14;
        sp.life--;
        ctx.globalAlpha = Math.max(0, sp.life / 42);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size || 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (sp.life <= 0) sparkles.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(draw);
    }

    refreshMoodButtons();
    syncQuickContinue();
    setupGame1();
    setupGame2();
    draw();
    showScreen(splashScreen);
  </script>
</body>
</html>
